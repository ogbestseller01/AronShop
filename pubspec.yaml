name: scann_product
description: "A product scanner and management application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  font_awesome_flutter: ^10.7.0

  # Networking
  dio: ^5.4.3+1

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.2

  # Scanner - Using compatible version
  mobile_scanner: ^7.4.0

  # Image Picker
  image_picker: ^1.1.2

  # Notifications
  fluttertoast: ^10.0.0

  # Permission handling
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # App Icon Generator
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# App Icon Configuration (Must be placed at the root level)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F97316"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#F97316"