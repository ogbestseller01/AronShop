name: scann_product
description: "A product scanner and management application , help to scan your product with digital scanner"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1

  dio: ^5.4.3+1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  mobile_scanner: ^7.4.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#001D45"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#001D45"